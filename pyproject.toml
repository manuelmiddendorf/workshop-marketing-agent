[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workshop-marketing-agent"
version = "0.1.0"
description = "A Python package foundation for AI-assisted workshop marketing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
